name: Android APK Build

on:
  push:
    paths:
      - 'MobileClient/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Silkroad Mobile APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure export keystore path
        run: |
          sed -i "s#keystore/debug=\"\"#keystore/debug=\"$HOME/.android/debug.keystore\"#" MobileClient/export_presets.cfg
          sed -i 's#keystore/debug_user=\"\"#keystore/debug_user=\"androiddebugkey\"#' MobileClient/export_presets.cfg
          sed -i 's#keystore/debug_password=\"\"#keystore/debug_password=\"android\"#' MobileClient/export_presets.cfg
          grep -nE 'keystore/debug|package/signed' MobileClient/export_presets.cfg

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Godot project
        working-directory: MobileClient
        run: godot --headless --editor-settings-dir "$HOME/.config/godot" --editor --quit --path .

      - name: Ensure Godot Android export templates
        run: |
          template_dir="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$template_dir"
          if [ ! -s "$template_dir/android_debug.apk" ] || [ ! -s "$template_dir/android_release.apk" ] || [ ! -s "$template_dir/android_source.zip" ]; then
            curl --fail --location --retry 3 -o /tmp/godot_export_templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
            unzip -j -o /tmp/godot_export_templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' -d "$template_dir"
          fi
          test -s "$template_dir/android_debug.apk"
          test -s "$template_dir/android_release.apk"
          test -s "$template_dir/android_source.zip"
          rm -rf MobileClient/android
          mkdir -p MobileClient/android/build
          unzip -q -o "$template_dir/android_source.zip" -d MobileClient/android/build
          printf '4.4.1.stable\n' > MobileClient/android/.build_version
          test -s MobileClient/android/build/build.gradle
          test "$(cat MobileClient/android/.build_version)" = "4.4.1.stable"
          find MobileClient/android/build -maxdepth 2 -type f | sort | head -40

      - name: Export release APK
        working-directory: MobileClient
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/SilkroadMobile.apk
          test -s build/SilkroadMobile.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 build/SilkroadMobile.apk build/SilkroadMobile-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/SilkroadMobile.apk build/SilkroadMobile-aligned.apk
          rm -f build/SilkroadMobile-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/SilkroadMobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilkroadMobile-debug-apk
          path: MobileClient/build/SilkroadMobile.apk
          if-no-files-found: error
          retention-days: 14
